name: Gerar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair o projeto
        run: unzip -q espelho.zip -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: cd src/* && gradle assembleDebug --no-daemon

      - name: Publicar o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" \
            src/*/app/build/outputs/apk/debug/app-debug.apk \
            --title "APK ${{ github.run_number }}" \
            --notes "APK de teste"
